<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Gestión Trabajos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let t of trabajos">
      <ion-label>
        <h2>{{ t.Nombre }}</h2>
        <p>ID: {{ t.IdTrabajo }}</p>
      </ion-label>
      <ion-button fill="clear" (click)="mostrarFormulario(t)">Editar</ion-button>
      <ion-button fill="clear" color="danger" (click)="borrarTrabajo(t.IdTrabajo)">Borrar</ion-button>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="mostrarFormulario()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
